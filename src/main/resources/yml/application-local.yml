spring:
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    defer-datasource-initialization: true
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:testdb
  h2:
    console:
      enabled: true
  config:
    activate:
      on-profile: local

  data:
    redis:
      host: localhost
      port: 6379
      repositories:
        enabled: false

file:
  storage:
    path:
      workplace: C:\workplace\
      user: C:\\uploads\\users\\

  endPoint:
    workplace: /api/workplace/file
    user: /api/users/file

management:
#  server:
#    port: 1313
  endpoints:
    web:
      exposure:
        include: "health, info, loggers, httpexchanges, metrics, prometheus"
    enabled-by-default: false
  endpoint:
    health:
      show-details: always
    info:
      enabled: true
    httpexchanges:
      enabled: true
    loggers:
      enabled: true
    metrics:
      enabled: true
  health:
    redis:
      enabled: false
  info:
    java:
      enabled: true
    os:
      enabled: true
    env:
      enabled: false
    git:
      enabled: true
      mode: full
    build:
      enabled: true

